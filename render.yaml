services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: market-pulse-api
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: market-pulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secure random value
      - key: JWT_EXPIRE_MINUTES
        value: "10080"               # 7 days
      - key: DEV_TRUST_HEADER
        value: "0"                   # MUST stay 0 in production
      - key: FRONTEND_URL
        value: "https://market-pulse.vercel.app"  # update after Vercel deploy
      - key: MARKET_API_URL
        value: "mock"
      - key: MARKET_API_KEY
        value: "mock"
      - key: PYTHON_VERSION
        value: "3.11.0"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
databases:
  - name: market-pulse-db
    databaseName: marketpulse
    plan: starter
    region: oregon

  # ── Redis (for ARQ background workers + WebSocket pub/sub) ───────────────────
  - name: market-pulse-redis
    type: redis
    plan: starter
    region: oregon
